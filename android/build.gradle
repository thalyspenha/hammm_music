allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // Workaround: plugins antigos (pre-AGP8, ex: on_audio_query_android) não
    // declaram `namespace` nem um JVM target consistente entre javac/kotlinc
    // — quebra com AGP9/JDK17. Aplica fix só nesses (não nos plugins já
    // modernos, que têm seus próprios requisitos de Java/SDK mais novos).
    afterEvaluate { sub ->
        if (sub.hasProperty('android') && sub.android.namespace == null) {
            sub.android {
                namespace sub.group.toString()
                compileSdkVersion 36
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        // Alinha o jvmTarget do Kotlin ao target Java de cada plugin. Sem
        // isso o kotlinc usa o target do JDK que roda o Gradle (21 no JBR do
        // Android Studio) e o build falha com "Inconsistent JVM-target
        // compatibility" em plugins que fixam Java 17 mas não o Kotlin (ex.:
        // on_audio_query_android, mesmo quando já declara `namespace`).
        if (sub.hasProperty('android')) {
            // Lido dentro do configureEach: o targetCompatibility só é
            // finalizado depois da avaliação dos projetos.
            sub.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = sub.android.compileOptions.targetCompatibility.toString()
                }
            }
        }
    }

    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
